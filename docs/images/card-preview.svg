<!--
  Schematic illustration of the Open Firenet Card (English UI).
  This is a hand-drawn mock-up, not a real screenshot: it documents the layout
  and the kind of values the card shows. The real card follows the Home
  Assistant theme and language (English and French are provided).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="440" height="700" viewBox="0 0 440 700" role="img" aria-labelledby="title">
  <title id="title">Illustration of the Open Firenet Card</title>
  <style>
    .t { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .primary { fill: #212121; }
    .secondary { fill: #727272; }
    .value { font-weight: 600; }
    .section { font-size: 12px; font-weight: 600; letter-spacing: 1.2px; fill: #727272; }
  </style>

  <!-- card -->
  <rect x="12" y="12" width="416" height="664" rx="14" fill="#ffffff" stroke="#e0e0e0" />

  <!-- header -->
  <circle cx="44" cy="48" r="17" fill="#fff3e0" />
  <g transform="translate(33,36)">
    <path d="M12 2c1 3 4 4 4 7a4 4 0 0 1-8 0c0-1 .5-2 1-2.5C9 8 8 7 8 5c0 0 1 1 2 1 0-2 2-4 2-4z" fill="#ff6d00" />
  </g>
  <text class="t primary" x="70" y="48" font-size="18" font-weight="600">Pellet stove</text>
  <text class="t secondary" x="70" y="67" font-size="12">RIKA DOMO</text>
  <rect x="300" y="34" width="112" height="26" rx="13" fill="#e8f5e9" />
  <circle cx="315" cy="47" r="4" fill="#43a047" />
  <text class="t" x="325" y="51" font-size="12" fill="#2e7d32">Connected</text>

  <!-- status -->
  <rect x="28" y="88" width="152" height="48" rx="14" fill="#fff3e0" />
  <g transform="translate(42,100) scale(0.8)">
    <path d="M12 2c1 3 4 4 4 7a4 4 0 0 1-8 0c0-1 .5-2 1-2.5C9 8 8 7 8 5c0 0 1 1 2 1 0-2 2-4 2-4z" fill="#e65100" />
  </g>
  <text class="t" x="72" y="118" font-size="17" font-weight="600" fill="#e65100">Heating</text>
  <text class="t primary value" x="288" y="112" font-size="22" text-anchor="end">21.4 °C</text>
  <text class="t secondary" x="288" y="128" font-size="11" text-anchor="end">Ambient</text>
  <text class="t primary value" x="412" y="112" font-size="22" text-anchor="end">22.0 °C</text>
  <text class="t secondary" x="412" y="128" font-size="11" text-anchor="end">Target</text>

  <line x1="28" y1="150" x2="412" y2="150" stroke="#eeeeee" />

  <!-- section: heating -->
  <path d="M30 178 l7 7 l7 -7" fill="none" stroke="#727272" stroke-width="2" stroke-linecap="round" />
  <text class="t section" x="54" y="184">HEATING</text>

  <rect x="28" y="200" width="104" height="40" rx="10" fill="#f5f5f5" stroke="#e0e0e0" />
  <path d="M50 210 a9 9 0 1 0 0.01 0 M50 210 v9" fill="none" stroke="#212121" stroke-width="2" stroke-linecap="round" />
  <text class="t primary" x="70" y="225" font-size="14">Stop</text>

  <rect x="168" y="200" width="40" height="40" rx="10" fill="#f5f5f5" stroke="#e0e0e0" />
  <text class="t primary" x="188" y="227" font-size="20" text-anchor="middle">−</text>
  <text class="t primary value" x="286" y="228" font-size="20" text-anchor="middle">22.0 °C</text>
  <rect x="364" y="200" width="40" height="40" rx="10" fill="#f5f5f5" stroke="#e0e0e0" />
  <text class="t primary" x="384" y="227" font-size="20" text-anchor="middle">+</text>

  <text class="t secondary" x="28" y="270" font-size="12">Mode</text>
  <rect x="74" y="252" width="80" height="32" rx="10" fill="#f5f5f5" stroke="#e0e0e0" />
  <text class="t primary" x="114" y="273" font-size="13" text-anchor="middle">Manual</text>
  <rect x="162" y="252" width="64" height="32" rx="10" fill="#f5f5f5" stroke="#e0e0e0" />
  <text class="t primary" x="194" y="273" font-size="13" text-anchor="middle">Auto</text>
  <rect x="234" y="252" width="88" height="32" rx="10" fill="#ff6d00" />
  <text class="t" x="278" y="273" font-size="13" text-anchor="middle" fill="#ffffff">Comfort</text>

  <rect x="28" y="306" width="384" height="6" rx="3" fill="#e0e0e0" />
  <rect x="28" y="306" width="269" height="6" rx="3" fill="#ff6d00" />
  <circle cx="297" cy="309" r="9" fill="#ff6d00" />
  <text class="t secondary" x="28" y="334" font-size="11">Power</text>
  <text class="t secondary" x="412" y="334" font-size="11" text-anchor="end">70 %</text>

  <line x1="28" y1="356" x2="412" y2="356" stroke="#eeeeee" />

  <!-- section: temperatures -->
  <path d="M30 384 l7 7 l7 -7" fill="none" stroke="#727272" stroke-width="2" stroke-linecap="round" />
  <text class="t section" x="54" y="390">TEMPERATURES</text>

  <rect x="28" y="406" width="124" height="64" rx="12" fill="#f5f5f5" />
  <circle cx="52" cy="438" r="9" fill="#ffa000" />
  <text class="t primary value" x="72" y="433" font-size="16">21.4 °C</text>
  <text class="t secondary" x="72" y="450" font-size="10">Ambient</text>

  <rect x="160" y="406" width="124" height="64" rx="12" fill="#f5f5f5" />
  <circle cx="184" cy="438" r="9" fill="#ff6d00" />
  <text class="t primary value" x="204" y="433" font-size="16">187 °C</text>
  <text class="t secondary" x="204" y="450" font-size="10">Combustion</text>

  <rect x="292" y="406" width="120" height="64" rx="12" fill="#f5f5f5" />
  <circle cx="316" cy="438" r="9" fill="#ffa000" />
  <text class="t primary value" x="336" y="433" font-size="16">42 °C</text>
  <text class="t secondary" x="336" y="450" font-size="10">Mainboard</text>

  <line x1="28" y1="490" x2="412" y2="490" stroke="#eeeeee" />

  <!-- section: consumption (collapsed) -->
  <path d="M32 514 l7 7 l-7 7" fill="none" stroke="#727272" stroke-width="2" stroke-linecap="round" />
  <text class="t section" x="54" y="528">CONSUMPTION &amp; MAINTENANCE</text>
  <text class="t primary value" x="412" y="528" font-size="14" text-anchor="end">1245 kg</text>

  <line x1="28" y1="548" x2="412" y2="548" stroke="#eeeeee" />

  <!-- section: bridge (collapsed) -->
  <path d="M32 572 l7 7 l-7 7" fill="none" stroke="#727272" stroke-width="2" stroke-linecap="round" />
  <text class="t section" x="54" y="586">BRIDGE</text>
  <text class="t primary value" x="412" y="586" font-size="14" text-anchor="end">-58 dBm</text>

  <line x1="28" y1="606" x2="412" y2="606" stroke="#eeeeee" />

  <!-- section: schedule (collapsed) -->
  <path d="M32 630 l7 7 l-7 7" fill="none" stroke="#727272" stroke-width="2" stroke-linecap="round" />
  <text class="t section" x="54" y="644">SCHEDULE &amp; PROTECTION</text>
  <text class="t primary value" x="412" y="644" font-size="14" text-anchor="end">Enabled</text>
</svg>
