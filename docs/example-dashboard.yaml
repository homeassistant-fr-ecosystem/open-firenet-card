# Open Firenet example dashboard
#
# English version — Français: ../fr/example-dashboard.yaml
#
# Paste this into a dashboard's YAML editor (raw configuration mode).
# The anchor entity `climate.open_firenet` is enough: the card finds every
# other entity of the same device on its own.

title: Stove
views:
  # Full view: display + controls
  - title: Stove
    path: stove
    icon: mdi:fire
    cards:
      - type: custom:open-firenet-card
        entity: climate.open_firenet
        title: Pellet stove

      # Compact read-only view.
      # `expanded_sections` picks the sections expanded on load; the others
      # show only their header (clickable to expand).
      - type: custom:open-firenet-card
        entity: climate.open_firenet
        title: Summary
        show_controls: false
        sections:
          - status
          - temperatures
          - consumption
          - bridge
        expanded_sections:
          - temperatures
          - consumption

      # Example of explicitly overriding an entity (if auto-renaming fails)
      - type: custom:open-firenet-card
        entity: climate.open_firenet
        title: Stove (forced sources)
        room_temperature: sensor.open_firenet_room_temperature
        stove_state: sensor.open_firenet_stove_state
        sections:
          - status
          - temperatures

      # Force the language (en / fr) instead of following the Home Assistant locale
      - type: custom:open-firenet-card
        entity: climate.open_firenet
        language: en
        sections:
          - status
          - climate

  # "Consumption / maintenance" view
  - title: Maintenance
    path: maintenance
    icon: mdi:tools
    cards:
      - type: custom:open-firenet-card
        entity: climate.open_firenet
        title: Consumption & maintenance
        show_controls: false
        service_interval: 1500
        sections:
          - consumption
          - mechanics
